<script>
/* ============================================================
   PASSPORT & RANKING SYSTEM (Integrated with dynamic categories)
   ============================================================ */

let STAMPS = [];
let TASKS  = [];

async function loadPassportData(){
  try {
    const [S, T] = await Promise.all([
      fetch("stamps.csv", { cache:"no-store" }).then(r => r.ok ? r.text() : "").catch(() => ""),
      fetch("tasks.csv",  { cache:"no-store" }).then(r => r.ok ? r.text() : "").catch(() => "")
    ]);
    if (S) {
      const parsed = Papa.parse(S, { header:true, skipEmptyLines:"greedy" });
      STAMPS = parsed.data
        .filter(r => key(r.STAMP_ID))
        .map(r => ({
          row: r,
          tasks: String(r.TASKS||"").split("|").map(s => s.trim()).filter(Boolean)
        }));
    }
    if (T) {
      const parsed = Papa.parse(T, { header:true, skipEmptyLines:"greedy" });
      TASKS = parsed.data.filter(r => key(r.TASK_ID)).map(r => ({ row: r }));
    }
  } catch (e) {
    console.warn("Couldn't load passport data:", e);
  }
}

function renderStampCards(){
  const box = document.getElementById("pStamps");
  if (!box) return;

  if (!STAMPS.length){
    box.innerHTML = `<h3>Tracks & Discoveries</h3><p style="color:#9aa3ad;font-size:13px">No tracks configured.</p>`;
    return;
  }

  box.innerHTML = `<h3>Historical Tracks</h3>` + STAMPS.map(stamp => {
    const r = stamp.row;
    const rankOn = String(r.RANK_ENABLED || "yes").toLowerCase() !== "no";
    const iconKey = r.ICON || "generic";
    const svgContent = ICONS[iconKey] ? `<svg viewBox="${ICONS[iconKey].vb}" width="28" height="28">${ICONS[iconKey].art}</svg>` : '';

    return `
      <div class="stamp-card ${rankOn ? 'ranked-track' : 'discovery-track'}" style="margin-bottom:10px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <div>${svgContent}</div>
          <div style="flex:1">
            <b>${esc(r.TITLE || r.STAMP_ID)}</b>
            <div style="font-size:11px;color:#666">${rankOn ? 'Rank Track Active' : 'Discovery Only (Unranked)'}</div>
          </div>
        </div>
      </div>`;
  }).join("");
}
</script>
