<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified Navigation Hub</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    /* Top Tabs Styling */
    .top-tabs {
      display: flex;
      gap: 5px;
      border-bottom: 2px solid #ccc;
    }
    .top-tab {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-bottom: none;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 14px;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }
    .top-tab.active {
      background: #fff;
      font-weight: bold;
      border-bottom: 2px solid #fff;
      margin-bottom: -2px;
    }

    /* Blurb Section Styling */
    .blurb-container {
      background-color: #f9f9f9;
      border: 1px solid #e0e0e0;
      padding: 15px;
      margin: 15px 0;
      border-radius: 4px;
    }

    /* Content Area Styling */
    .content-area {
      position: relative;
      height: 75vh; /* Adjust height based on your design */
    }

    /* Iframe Containers */
    .page-container {
      display: none;
      width: 100%;
      height: 100%;
    }
    .page-container.active {
      display: block;
    }

    /* Full-size Iframe */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. Top Level Navigation -->
  <div class="top-tabs" role="tablist">
    <button class="top-tab active" data-target="p1" data-blurb="Welcome to Page 1. Use the left menu inside to manage primary data fields.">Page 1</button>
    <button class="top-tab" data-target="p2" data-blurb="Welcome to Page 2. Review the structural configuration tools layout.">Page 2</button>
    <button class="top-tab" data-target="p3" data-blurb="Welcome to Page 3. Update map settings and spatial coordinates.">Page 3</button>
    <!-- Add tabs 4 through 7 identically here -->
  </div>

  <!-- 2. Dynamic Blurb Area -->
  <div class="blurb-container">
    <p id="dynamic-blurb">Welcome to Page 1. Use the left menu inside to manage primary data fields.</p>
  </div>

  <!-- 3. Embedded Pages (The Progress-Saving Engine) -->
  <div class="content-area">
    
    <div id="p1" class="page-container active">
      <iframe src="tours.html"></iframe>
    </div>

    <div id="p2" class="page-container">
      <iframe src="spots.html"></iframe>
    </div>

    <div id="p3" class="page-container">
      <iframe src="editor.html"></iframe>
    </div>
    
    <!-- Add containers for p4 through p7 identically here -->

  </div>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const tabs = document.querySelectorAll(".top-tab");
  const containers = document.querySelectorAll(".page-container");
  const blurbText = document.getElementById("dynamic-blurb");

  // Keep track of which pages have already been opened/loaded correctly
  const loadedPages = { p1: true }; 

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      // 1. Remove active state from current tab and container
      document.querySelector(".top-tab.active").classList.remove("active");
      document.querySelector(".page-container.active").classList.remove("active");

      // 2. Add active state to clicked tab and corresponding container
      tab.classList.add("active");
      const targetId = tab.getAttribute("data-target");
      const targetContainer = document.getElementById(targetId);
      targetContainer.classList.add("active");

      // 3. Dynamically update the instructions blurb
      blurbText.innerHTML = tab.getAttribute("data-blurb");

      
      if (!loadedPages[targetId]) {
        const iframe = targetContainer.querySelector("iframe");
        if (iframe) {
          iframe.src = iframe.src; // This cleanly forces the iframe map to recalculate its width/height
        }
        loadedPages[targetId] = true; // Mark as loaded so it saves user progress moving forward
      }
    });
  });
});

  </script>

</body>
</html>
