</style>`);

  const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>`;
  const starRow = (n, newest) =>
    [1, 2, 3].map(i => `<span class="${i <= n ? "on" : "off"}${i === newest ? " new" : ""}">${STAR}</span>`).join("");

  document.body.insertAdjacentHTML("beforeend", `
<div id="pSlam" role="dialog" aria-modal="true" aria-labelledby="pRank" tabindex="-1">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="pInk"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
  </svg>
  <div class="rays"></div>
  <canvas></canvas>
  <div class="box"></div>
</div>`);

  document.querySelector(".passport-body").insertAdjacentHTML("beforeend", `<div id="pStamps"></div>`);

  const slam = document.getElementById("pSlam");

  let stopConfetti = null;
  function confetti(canvas) {
    const ctx = canvas.getContext("2d");
    const W = canvas.width = innerWidth, H = canvas.height = innerHeight;
    const colors = ["#E47303", "#AF350A", "#91AF45", "#BDD76B", "#FFC20E", "#ffffff"];
    const bits = Array.from({ length: 150 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      vx: -1 + Math.random() * 2, vy: 2 + Math.random() * 3.5,
      r: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    const t0 = performance.now();
    let id = 0;
    (function tick(now) {
      ctx.clearRect(0, 0, W, H);
      bits.forEach(b => {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.r);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      });
      if (now - t0 < 4500) id = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, W, H);
    })(t0);
    return () => { cancelAnimationFrame(id); ctx.clearRect(0, 0, W, H); };
  }

  let queue = [], showing = false, autoTimer = 0;

  function rewardPriority(job){
    if (job.kind === "grand") return 4;
    if (job.kind === "star" && job.stars >= 3) return 3;
    if (job.kind === "star") return 2;
    return 1;
  }

  function enqueueRewards(jobs){
    if (!jobs.length) return;
    queue.push(...jobs);
    // Keep the whole pending queue in celebration order, not just this event.
    queue.sort((a, b) => rewardPriority(a) - rewardPriority(b));
    pump();
  }

  function celebrateStamp(stamp, stars, replay, kind){
    enqueueRewards([{ stamp, stars, replay, kind: kind || "star" }]);
  }

  function allRanksComplete(){
    const active = STAMPS.filter(stampActive);
    return active.length > 0 &&
      active.every(stamp => starsFor(stamp.row, countFor(stamp)) >= 3);
  }

  function pump(){
    if (showing || !queue.length) return;
    if (document.getElementById("welcomeOverlay")) { setTimeout(pump, 500); return; }
    showing = true;
    const job = queue.shift();
    setTimeout(() => render(job), job.replay ? 0 : 600);
  }

  function render(job){
    const { stamp, stars, replay, kind } = job;
    const row = stamp.row;
    const rank = rankFor(row, stars);
    const done = stars >= 3;
    const isStar = kind === "star";
    const isGrand = kind === "grand";
    const taskLabel = job.taskLabel || "";

    slam.classList.toggle("plain", !isStar && !isGrand);

    if (isGrand) {
      slam.querySelector(".box").innerHTML =
        `<div class="seal">${VEHICLE_SVG.train}<b>MASTER HISTORIAN</b></div>` +
        `<div class="rank" id="pRank" aria-live="polite">Every category mastered!</div>` +
        `<div class="grand">Three stars in every active rank</div>` +
        `<div class="note">You've completed the History Passport challenge!</div>` +
        `<div class="tap">TAP TO CONTINUE</div>`;
    } else {
      slam.querySelector(".box").innerHTML =
        `<div class="seal">${VEHICLE_SVG[String(row.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}<b>${esc(row.TITLE||"")}</b></div>` +
        (isStar
          ? `<div class="stars">${starRow(stars, replay ? 0 : stars)}</div>` +
            `<div class="rank" id="pRank" aria-live="polite">${esc(rank)}</div>` +
            (done ? `<div class="grand">${esc(row.GRAND_RANK || "")}</div>` : "")
          : `<div class="rank" style="font-size:20px">${esc(taskLabel || "Task complete!")}</div>`) +
        `<div class="tap">TAP TO CONTINUE</div>`;
    }

    slam.classList.add("on");
    if (isStar || isGrand) slam.classList.add("hit");
    slam.focus();

    // Confetti is reserved for a newly earned third star or the final passport reward.
    if ((isGrand || (isStar && done)) && !REDUCED) {
      stopConfetti = confetti(slam.querySelector("canvas"));
    }
    const duration = isGrand ? 12000 : (isStar && done ? 10000 : (isStar ? 6000 : 2600));
    autoTimer = setTimeout(() => dismiss(replay), duration);
  }

 
function dismiss(replay){
  if (!slam.classList.contains("on")) return;

  clearTimeout(autoTimer);

  if (stopConfetti) {
    stopConfetti();
    stopConfetti = null;
  }

  slam.classList.remove("on", "hit", "plain");

  if (replay !== true) {
    $("passportBtn").classList.add("nudge");
  }

  renderStampCards();

  // Allow the next queued stamp, star, or rank reward to display.
  showing = false;
  pump();
}

  slam.addEventListener("click", () => dismiss());
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && slam.classList.contains("on")) { dismiss(); e.stopPropagation(); }
  }, true);

  let featuredId = null;

  window.renderStampCards = function(){
    const box = document.getElementById("pStamps");
    if (!box) return;

    if (!STAMPS.length && !TASKS.length){
      box.innerHTML = `<h3 class="p-h">Ranks and tasks</h3><p style="color:#9aa3ad;font-size:13px;margin:0">Loading…</p>`;
      return;
    }

    const active = STAMPS.filter(stampActive);
    const inActive = new Set();
    active.forEach(s => s.tasks.forEach(id => inActive.add(key(id))));
    const loose = TASKS.filter(t => !inActive.has(key(t.row.TASK_ID)));   // tasks that do not count toward a rank

    let html = "";
    if (active.length){
      if (!featuredId || !active.find(s => key(s.row.STAMP_ID) === key(featuredId))){
        let best = active[0], bestCount = -1;
        active.forEach(s => { const c = countFor(s); if (c > bestCount){ best = s; bestCount = c; } });
        featuredId = best.row.STAMP_ID;
      }
      const featured = active.find(s => key(s.row.STAMP_ID) === key(featuredId));
      const fr = featured.row;
      const fCount = countFor(featured);
      const fStars = starsFor(fr, fCount);
      const fRank = rankFor(fr, fStars);
      const totalTasks = featured.tasks.length;
      const next = [+fr.STAR1 || 0, +fr.STAR2 || 0, +fr.STAR3 || 0].find(t => t > fCount);
      const toGo = next && next <= totalTasks ? next - fCount : 0;
      const featTasks = featured.tasks.map(id => TASKS.find(t => key(t.row.TASK_ID) === key(id))).filter(Boolean);

      html += `
        <h3 class="p-h">Ranks</h3>
        <div class="p-featured" data-id="${esc(fr.STAMP_ID)}">
          <div class="emblem">
            ${VEHICLE_SVG[String(fr.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}
            <b>${esc(fr.TITLE||"")}</b>
          </div>
          <h4>${esc(fr.TITLE||"")}</h4>
          <div class="stars">${starRow(fStars, 0)}</div>
          <div class="rank">${esc(fRank || "Not started yet")}</div>
          <div class="prog">${fCount} of ${totalTasks} tasks done${toGo ? " · " + toGo + " more for the next star" : ""}</div>
          ${fStars >= 3 && fr.GRAND_RANK ? `<div class="grand">${esc(fr.GRAND_RANK)}</div>` : ""}
        </div>
        <div class="p-tiles">
          ${active.map(s => {
            const r = s.row;
            const st = starsFor(r, countFor(s));
            const sel = key(r.STAMP_ID) === key(fr.STAMP_ID);
            return `
              <div class="p-tile ${sel ? "sel" : ""}" data-id="${esc(r.STAMP_ID)}">
                <div class="emblem">${VEHICLE_SVG[String(r.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}</div>
                <div class="name">${esc(r.TITLE||"")}</div>
                <div class="stars">${starRow(st, 0)}</div>
              </div>`;
          }).join("")}
        </div>
        <h4 class="p-tasks-h">Tasks: ${esc(fr.TITLE||"")}</h4>
        ${featTasks.map(taskRowHTML).join("") || `<p class="p-none">No tasks set up for this rank yet.</p>`}`;
    }

    if (loose.length){
      html += `<h4 class="p-tasks-h">${active.length ? "More to do" : "Tasks"}</h4>` + loose.map(taskRowHTML).join("");
    }

    box.innerHTML = html;

    box.querySelectorAll(".p-featured[data-id], .p-tile[data-id]").forEach(el => {
      el.onclick = () => { featuredId = el.dataset.id; renderStampCards(); };
    });
    box.querySelectorAll(".p-task-btn").forEach(btn => {
      btn.onclick = () => {
        const t = TASKS.find(x => key(x.row.TASK_ID) === key(btn.dataset.task));
        if (t) runTaskAction(t);
      };
    });
  };

  $("passportBtn").onclick = () => {
    $("passportBtn").classList.remove("nudge");
    updatePassportUI();
    renderStampCards();
    $("passportDrawer").classList.add("open");
  };

  // One-time location check: lights every passport place within reach. Nothing is stored or sent.
  $("checkinBtn").onclick = () => {
    const out = $("checkinMsg");
    if (!navigator.geolocation) { out.textContent = "Location isn't available on this device."; return; }
    out.textContent = "Checking where you are…";
    navigator.geolocation.getCurrentPosition(pos => {
      const here = [pos.coords.longitude, pos.coords.latitude];
      const slack = Math.min(pos.coords.accuracy || 0, 50);
      const near = majorSites().filter(s => distM(here, s.ll) <= (parseFloat(s.d.RADIUS) || 75) + slack);
      if (!near.length){ out.textContent = "No passport places are close by. Get a little nearer and try again."; return; }
      near.forEach(s => {
        unlockStamp(s.id);
        if (window.passportEvent) passportEvent("view", { id: s.id, category: (s.d && s.d.CATEGORY) || null, source: "gps" });
      });
      updatePassportUI();
      out.textContent = "You're at " + near.map(s => s.name).join(", ") + "!";
    }, () => { out.textContent = "Couldn't get your location. Check your browser's location permission."; },
    { enableHighAccuracy: true, timeout: 10000 });
  };

  // A site visit and a task are separate things: visiting lights a stamp (see unlockStamp);
  // this only completes TASKS. Stars come only from tasks that belong to an active rank track.
  window.passportEvent = (type, context = {}) => {
    if (SITE.passport === false || !TASKS.length) return;

    const wasAllRanksComplete = allRanksComplete();
    const progress = loadProgress();
    progress._done = progress._done || {};
    progress._seen = progress._seen || {};
    const hit = [];

    for (const t of TASKS){
      const id = String(t.row.TASK_ID).trim();
      if (progress._done[id]) continue;
      if (!taskMatches(t.row, type, context)) continue;
      const need = parseInt(t.row.COUNT, 10) || 1;
      if (need > 1){
        const seen = progress._seen[id] || (progress._seen[id] = []);
        const cid = String(context.id || "");
        if (cid && !seen.includes(cid)) seen.push(cid);
        if (seen.length < need) continue;
      }
      progress._done[id] = true;
      hit.push(t);
    }
    saveProgress(progress);
    if (!hit.length) return;

    const jobs = [];
    window.__lastStars = window.__lastStars || {};

    for (const t of hit){
      const owners = STAMPS.filter(s =>
        stampActive(s) && s.tasks.some(x => key(x) === key(t.row.TASK_ID))
      );
      const label = t.row.LABEL || "Task complete!";

      if (!owners.length){
        jobs.push({
          stamp: { row: { TITLE: "", VEHICLE: "generic" } },
          stars: 0, replay: false, kind: "plain", taskLabel: label
        });
        continue;
      }

      for (const stamp of owners){
        const sid = String(stamp.row.STAMP_ID).trim();
        const stars = starsFor(stamp.row, countFor(stamp));
        const prev = Number(window.__lastStars[sid] || 0);

        if (stars > prev){
          // Only queue one star upgrade at the point the category advances.
          jobs.push({ stamp, stars, replay: false, kind: "star" });
          window.__lastStars[sid] = stars;
        } else {
          jobs.push({ stamp, stars, replay: false, kind: "plain", taskLabel: label });
        }
      }
    }

    try {
      localStorage.setItem(LAST_STARS_KEY, JSON.stringify(window.__lastStars));
    } catch {}

    // The overall finale is eligible only on the transition into full completion.
    if (!wasAllRanksComplete && allRanksComplete()){
      jobs.push({
        stamp: { row: { TITLE: "MASTER HISTORIAN", VEHICLE: "train", GRAND_RANK: "" } },
        stars: 3, replay: false, kind: "grand"
      });
    }

    enqueueRewards(jobs);
    renderStampCards();
  };
  function nudgeWhenReady(){
    if (document.getElementById("welcomeOverlay")) { setTimeout(nudgeWhenReady, 2000); return; }
    if (!localStorage.getItem(STAMP_KEY)) $("passportBtn").classList.add("nudge");
  }
  setTimeout(nudgeWhenReady, 8000);

})();

(function () {
  const sid = new URLSearchParams(location.search).get("site");
  if (!sid) return;
  let tries = 0;
  const t = setInterval(() => {
    const it = places.concat(kids).find(p => key(p.id) === key(sid));
    if (!it && ++tries < 60) return;
    clearInterval(t);
    if (!it) { console.warn("No place called " + sid); return; }
    select(it);
  }, 250);
})();

   AERIAL VIEW: USGS imagery everywhere, with Indiana's own (sharper) imagery on top when zoomed in
   ============================================================ */
const AERIAL = {
  usgs: {
    tiles: ["https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}"],
    maxzoom: 16,
    attribution: "Imagery: USGS The National Map / USDA NAIP"
  },
  indiana: {
    tiles: ["https://di-ingov.img.arcgis.com/arcgis/rest/services/DynamicWebMercator/Indiana_Current_Imagery/ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=jpgpng&f=image"],
    maxzoom: 20,
    attribution: "Imagery: Indiana Geographic Information Office (IGIO)"
  }
};
const inIndiana = c => c.lng > -88.1 && c.lng < -84.78 && c.lat > 37.77 && c.lat < 41.77;   // rough box; the layer is only added for Indiana maps
function setAerial(on){
  try {
    if (on && !map.getSource("usgs-tiles")) {
      const order = map.getStyle().layers.map(l => l.id);
      const beforeId = order[order.indexOf("osm") + 1];   // just above the street map, below boundary lines and old-map overlays
      map.addSource("usgs-tiles", { type: "raster", tiles: AERIAL.usgs.tiles, tileSize: 256, maxzoom: AERIAL.usgs.maxzoom, attribution: AERIAL.usgs.attribution });
      map.addLayer({ id: "aerial-usgs", type: "raster", source: "usgs-tiles" }, beforeId);
      if (inIndiana(map.getCenter())) {
        map.addSource("indiana-tiles", { type: "raster", tiles: AERIAL.indiana.tiles, tileSize: 256, maxzoom: AERIAL.indiana.maxzoom, attribution: AERIAL.indiana.attribution });
        map.addLayer({ id: "aerial-indiana", type: "raster", source: "indiana-tiles", minzoom: 13 }, beforeId);
      }
    }
    ["aerial-usgs", "aerial-indiana"].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); });
    map.setLayoutProperty("osm", "visibility", on ? "none" : "visible");
    $("aerialBtn").setAttribute("aria-pressed", on ? "true" : "false");
  } catch (e) { console.warn("Aerial view is not ready yet", e); }
}
$("aerialBtn").onclick = () => setAerial($("aerialBtn").getAttribute("aria-pressed") !== "true");

/* ============================================================
   EVENT / FOCUS PANEL (text comes from site.csv)
   ============================================================ */
function renderEventSwitcher(){
  const box = $("ev-switch");
  box.innerHTML = "";
  if (!EVENTS_INDEX.length) return;
  const h = document.createElement("h3");
  h.textContent = "Events";
  box.appendChild(h);
  const add = (label, note, href, current) => {
    const a = document.createElement("a");
    a.className = "ev-link" + (current ? " cur" : "");
    a.href = href;
    if (current) a.setAttribute("aria-current", "page");
    a.textContent = label;
    if (note) { const s = document.createElement("small"); s.textContent = note; a.appendChild(s); }
    box.appendChild(a);
  };
  add("Main map", "", location.pathname, !EVENT_SLUG);
  EVENTS_INDEX.forEach(ev => add(ev.name || ev.slug, ev.note || "", location.pathname + "?event=" + encodeURIComponent(ev.slug), ev.slug === EVENT_SLUG));
}
function refreshEventButton(){
  const own = !!(SITE.event.title || SITE.event.text);
  if (!own && !EVENTS_INDEX.length) return;
  $("eventBtn").textContent = own ? SITE.event.button : "Events";
  $("eventBtn").hidden = false;
}
function openEventPanel(){
  $("ev-title").textContent = SITE.event.title;
  $("ev-title").hidden = !SITE.event.title;
  $("ev-text").textContent = SITE.event.text;
  $("ev-text").hidden = !SITE.event.text;
  renderEventSwitcher();
  $("eventBox").hidden = false;
  $("ev-x").focus();
}
function closeEventPanel(){
  if ($("eventBox").hidden) return;
  $("eventBox").hidden = true;
  $("eventBtn").focus();
}
$("eventBtn").onclick = openEventPanel;
$("ev-x").onclick = closeEventPanel;
$("eventBox").addEventListener("click", e => { if (e.target === $("eventBox")) closeEventPanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeEventPanel(); });

</script>
