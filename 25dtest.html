<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Photo Animator Tool (With Work-Space Zoom)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #fff; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            width: 1100px;
            margin-top: 20px;
        }
        .workspace, .controls {
            background-color: #262626;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .workspace {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 500px;
        }
        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-container {
            position: relative;
            background-color: #111;
            border: 2px dashed #444;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            width: 650px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Wrapper viewport used to scale and translate the underlying stack */
        .canvas-viewport {
            position: absolute;
            transform-origin: 0 0;
            display: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 13px; color: #aaa; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .status {
            font-size: 14px;
            color: #ffc107;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        .hidden { display: none !important; }
        .zoom-tip {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>2.5D Photo Animator</h1>
    <p style="margin: 0; color: #888;">Isolate a foreground subject to generate a 3D parallax zoom loop.</p>

    <div class="container">
        <div class="workspace">
            <input type="file" id="upload" accept="image/*">
            <div class="canvas-container" id="canvasBox">
                <span id="uploadPrompt" style="color: #666;">Upload an image to begin</span>
                
                <!-- The Viewport wrapper handles the physical zoom matrix transforms -->
                <div id="viewport" class="canvas-viewport">
                    <canvas id="bgCanvas" style="z-index: 1;"></canvas>
                    <canvas id="maskCanvas" style="z-index: 2;"></canvas>
                    <canvas id="viewCanvas" style="z-index: 3; display: none;"></canvas>
                </div>
            </div>
            <div class="zoom-tip" id="zoomTip">💡 <b>Scroll Wheel</b> to Zoom In/Out. <b>Hold Spacebar + Drag Mouse</b> to Pan around.</div>
            <div id="statusMsg" class="status"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>1. Brush Settings</label>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="range" id="brushSize" min="3" max="80" value="20">
                    <span id="brushVal" style="width:30px;">20px</span>
                </div>
                <button id="clearMaskBtn" class="hidden" style="background:#dc3545;">Reset Mask</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; width:100%;">

            <div class="control-group">
                <label>2. Timeline Preview</label>
                <button id="generateBtn" disabled>Generate Animation</button>
                <button id="editBtn" class="hidden">Back to Masking</button>
            </div>

            <div id="animSliders" class="hidden" style="display:flex; flex-direction:column; gap:15px;">
                <div class="control-group">
                    <label>Background Zoom Speed</label>
                    <input type="range" id="bgZoom" min="0" max="40" value="25">
                </div>
                <div class="control-group">
                    <label>Foreground Zoom Speed</label>
                    <input type="range" id="fgZoom" min="0" max="40" value="0">
                </div>
                <div class="control-group">
                    <label>Animation Duration (Seconds)</label>
                    <input type="range" id="duration" min="1" max="5" value="3" step="0.5">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; width:100%;">

            <div class="control-group">
                <label>3. Export File</label>
                <button id="exportBtn" class="btn-success" disabled>Export as GIF</button>
            </div>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const canvasBox = document.getElementById('canvasBox');
        const viewport = document.getElementById('viewport');
        const maskCanvas = document.getElementById('maskCanvas');
        const bgCanvas = document.getElementById('bgCanvas');
        const viewCanvas = document.getElementById('viewCanvas');
        const brushSize = document.getElementById('brushSize');
        const brushVal = document.getElementById('brushVal');
        const generateBtn = document.getElementById('generateBtn');
        const editBtn = document.getElementById('editBtn');
        const clearMaskBtn = document.getElementById('clearMaskBtn');
        const exportBtn = document.getElementById('exportBtn');
        const animSliders = document.getElementById('animSliders');
        const bgZoomSlider = document.getElementById('bgZoom');
        const fgZoomSlider = document.getElementById('fgZoom');
        const durationSlider = document.getElementById('duration');
        const statusMsg = document.getElementById('statusMsg');

        const maskCtx = maskCanvas.getContext('2d');
        const bgCtx = bgCanvas.getContext('2d');
        const viewCtx = viewCanvas.getContext('2d');

        let sourceImg = null;
        let isDrawing = false;
        let isAnimating = false;
        let animFrameId = null;
        let imgWidth = 0;
        let imgHeight = 0;
        let startTime = 0;

        // Interactive Workspace Zoom & Pan States
        let zoomLevel = 1.0;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let isSpacePressed = false;

        const fgTempCanvas = document.createElement('canvas');
        const fgTempCtx = fgTempCanvas.getContext('2d');
        const bgTempCanvas = document.createElement('canvas');
        const bgTempCtx = bgTempCanvas.getContext('2d');

        brushSize.addEventListener('input', (e) => {
            brushVal.textContent = e.target.value + 'px';
        });

        // Track Spacebar layout hooks
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = true;
                canvasBox.style.cursor = 'grab';
                if(e.target == document.body) e.preventDefault(); // Stop page scrolling
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                canvasBox.style.cursor = 'crosshair';
            }
        });

        // 1. Mouse Wheel Zoom Event Engine
        canvasBox.addEventListener('wheel', (e) => {
            if (!sourceImg) return;
            e.preventDefault();

            const rect = canvasBox.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Determine workspace coordinates relative to old zoom matrix scale boundaries
            const worldX = (mouseX - panX) / zoomLevel;
            const worldY = (mouseY - panY) / zoomLevel;

            // Zoom bounds limits configuration (1x to 5x magnification)
            const zoomFactor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            zoomLevel = Math.max(1.0, Math.min(5.0, zoomLevel * zoomFactor));

            // Adjust pan metrics synchronously to focus anchor directly onto mouse tip target location
            panX = mouseX - worldX * zoomLevel;
            panY = mouseY - worldY * zoomLevel;

            // Bound checking to contain view frame tracking
clampViewport();
updateViewportTransform();
});
function clampViewport() {
const containerW = 650;
const containerH = 450;
// Limit pan displacements safely inside frame container view metrics
const minX = containerW - imgWidth * zoomLevel;
const minY = containerH - imgHeight * zoomLevel;
panX = Math.min(0, Math.max(minX, panX));
panY = Math.min(0, Math.max(minY, panY));
// Re-center alignment axis if magnification levels scale out completely
if (imgWidth * zoomLevel <= containerW) panX = (containerW - imgWidth * zoomLevel) / 2;
if (imgHeight * zoomLevel <= containerH) panY = (containerH - imgHeight * zoomLevel) / 2;
}
function updateViewportTransform() {
viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
}
upload.addEventListener('change', (e) => {
if (!e.target.files || e.target.files.length === 0) return;
const file = e.target.files[0];
statusMsg.textContent = "Loading image into memory...";
statusMsg.style.color = "#ffc107";
const reader = new FileReader();
reader.onload = (event) => {
sourceImg = new Image();
sourceImg.onload = () => {
setupWorkspace();
};
sourceImg.src = event.target.result;
};
reader.readAsDataURL(file);
});
function setupWorkspace() {
stopAnimation();
// Reset zoom matrix layouts completely
zoomLevel = 1.0;
panX = 0;
panY = 0;
imgWidth = sourceImg.naturalWidth || sourceImg.width;
imgHeight = sourceImg.naturalHeight || sourceImg.height;
const maxW = 650;
const maxH = 450;
let scale = Math.min(maxW / imgWidth, maxH / imgHeight);
imgWidth = Math.floor(imgWidth * scale);
imgHeight = Math.floor(imgHeight * scale);
// Configure initial positioning setups
panX = (maxW - imgWidth) / 2;
panY = (maxH - imgHeight) / 2;
[maskCanvas, bgCanvas, viewCanvas, fgTempCanvas, bgTempCanvas].forEach(canvas => {
canvas.width = imgWidth;
canvas.height = imgHeight;
canvas.style.width = imgWidth + "px";
canvas.style.height = imgHeight + "px";
});
bgCtx.clearRect(0, 0, imgWidth, imgHeight);
bgCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
maskCtx.clearRect(0, 0, imgWidth, imgHeight);
uploadPrompt.style.display = 'none';
viewport.style.display = 'block';
bgCanvas.style.display = 'block';
maskCanvas.style.display = 'block';
viewCanvas.style.display = 'none';
updateViewportTransform();
clearMaskBtn.classList.remove('hidden');
generateBtn.removeAttribute('disabled');
exportBtn.setAttribute('disabled', 'true');
editBtn.classList.add('hidden');
generateBtn.classList.remove('hidden');
animSliders.classList.add('hidden');
statusMsg.textContent = "Zoom & Pan active. Trace your foreground building mask precisely!";
statusMsg.style.color = "#28a745";
}
// 2. Mouse Input Vector Controls (Handles Drawing VS Workspace Panning)
canvasBox.addEventListener('mousedown', (e) => {
if (!sourceImg || isAnimating) return;
if (isSpacePressed || e.button === 1) { // Middle click or Space+Click activates workspace Pan
isPanning = true;
canvasBox.style.cursor = 'grabbing';
startPanX = e.clientX - panX;
startPanY = e.clientY - panY;
e.preventDefault();
} else if (e.button === 0) { // Left click activates Paint
isDrawing = true;
paintMove(e);
}
});
canvasBox.addEventListener('mousemove', (e) => {
if (isPanning) {
panX = e.clientX - startPanX;
panY = e.clientY - startPanY;
clampViewport();
updateViewportTransform();
} else if (isDrawing) {
paintMove(e);
}
});
window.addEventListener('mouseup', () => {
isDrawing = false;
if (isPanning) {
isPanning = false;
canvasBox.style.cursor = isSpacePressed ? 'grab' : 'crosshair';
}
});
function paintMove(e) {
if (!isDrawing) return;
const rect = maskCanvas.getBoundingClientRect();
// Mathematical conversion calculation to find precise tracing pixels under current zoom/pan state
const x = (e.clientX - rect.left) * (imgWidth / rect.width);
const y = (e.clientY - rect.top) * (imgHeight / rect.height);
maskCtx.save();
maskCtx.fillStyle = 'rgb(255,0,0)';          // in paintMove
maskCanvas.style.opacity = '0.6';            // once, at setup
maskCtx.beginPath();
maskCtx.arc(x, y, brushSize.value / 2, 0, Math.PI * 2);
maskCtx.fill();
maskCtx.restore();
}
clearMaskBtn.addEventListener('click', () => {
if (confirm("Clear trace mask?")) setupWorkspace();
});
// 3. 2.5D Layer Isolation Engine With Seam Feathering Passes
generateBtn.addEventListener('click', prepareAndAnimate);
editBtn.addEventListener('click', () => {
stopAnimation();
bgCanvas.style.display = 'block';
maskCanvas.style.display = 'block';
viewCanvas.style.display = 'none';
editBtn.classList.add('hidden');
generateBtn.classList.remove('hidden');
animSliders.classList.add('hidden');
exportBtn.setAttribute('disabled', 'true');
statusMsg.textContent = "Returned to workspace.";
statusMsg.style.color = "#ffc107";
});
function prepareAndAnimate() {
statusMsg.textContent = "Isolating canvas layout layers...";
// Foreground cutout with softened edge
// Foreground cutout with softened edge
fgTempCtx.clearRect(0, 0, imgWidth, imgHeight);
fgTempCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
fgTempCtx.globalCompositeOperation = 'destination-in';
fgTempCtx.filter = 'blur(1.5px)';
fgTempCtx.drawImage(maskCanvas, 0, 0);
fgTempCtx.filter = 'none';
fgTempCtx.globalCompositeOperation = 'source-over';
// Force visibility setups to block interactions and activate timeline previews
bgCanvas.style.display = 'none';
maskCanvas.style.display = 'none';
viewCanvas.style.display = 'block';
generateBtn.classList.add('hidden');
editBtn.classList.remove('hidden');
animSliders.classList.remove('hidden');
exportBtn.removeAttribute('disabled');
// Reset zoom matrix layouts back to baseline center point for pristine animation viewing
zoomLevel = 1.0;
panX = (650 - imgWidth) / 2;
panY = (450 - imgHeight) / 2;
updateViewportTransform();
isAnimating = true;
startTime = performance.now();
renderParallaxFrame();
}
function stopAnimation() {
isAnimating = false;
if (animFrameId) cancelAnimationFrame(animFrameId);
}
function renderParallaxFrame(time = performance.now()) {
if (!isAnimating) return;
viewCtx.clearRect(0, 0, imgWidth, imgHeight);
const bgMax = parseFloat(bgZoomSlider.value) / 200;
const fgMax = parseFloat(fgZoomSlider.value) / 200;
const dur = parseFloat(durationSlider.value);
let elapsed = ((time - startTime) / 1000) % dur;
let progress = elapsed / dur;
let ease = Math.sin(progress * Math.PI);
let bgS = 1.0 + (ease * bgMax);
let fgS = 1.0 + (ease * fgMax);
// Draw Background Layer Matrix
viewCtx.save();
viewCtx.translate(imgWidth / 2, imgHeight / 2);
viewCtx.scale(bgS, bgS);
viewCtx.drawImage(bgTempCanvas, -imgWidth / 2, -imgHeight / 2);
viewCtx.restore();
// Draw Feathered Subject Layer Matrix
viewCtx.save();
viewCtx.translate(imgWidth / 2, imgHeight / 2);
viewCtx.scale(fgS, fgS);
viewCtx.drawImage(fgTempCanvas, -imgWidth / 2, -imgHeight / 2);
viewCtx.restore();
statusMsg.textContent = "Live parallax preview loop active.";
statusMsg.style.color = "#007bff";
animFrameId = requestAnimationFrame(renderParallaxFrame);
}
// 4. Sequence Capture Array & GIF Compilation Processing Loop
exportBtn.addEventListener('click', () => {
stopAnimation();
exportBtn.setAttribute('disabled', 'true');
statusMsg.textContent = "Encoding layout assets into looping GIF. Please wait...";
statusMsg.style.color = "#ffc107";
const bgMax = parseFloat(bgZoomSlider.value) / 200;
const fgMax = parseFloat(fgZoomSlider.value) / 200;
const dur = parseFloat(durationSlider.value);
const totalFrames = 25;
const imageFramesArray = [];
const captureCanvas = document.createElement('canvas');
captureCanvas.width = imgWidth;
captureCanvas.height = imgHeight;
const captureCtx = captureCanvas.getContext('2d');
for (let i = 0; i < totalFrames; i++) {
let progress = i / totalFrames;
let ease = Math.sin(progress * Math.PI);
let bgS = 1.0 + (ease * bgMax);
let fgS = 1.0 + (ease * fgMax);
captureCtx.clearRect(0, 0, imgWidth, imgHeight);
captureCtx.save();
captureCtx.translate(imgWidth / 2, imgHeight / 2);
captureCtx.scale(bgS, bgS);
captureCtx.drawImage(bgTempCanvas, -imgWidth / 2, -imgHeight / 2);
captureCtx.restore();
captureCtx.save();
captureCtx.translate(imgWidth / 2, imgHeight / 2);
captureCtx.scale(fgS, fgS);
captureCtx.drawImage(fgTempCanvas, -imgWidth / 2, -imgHeight / 2);
captureCtx.restore();
imageFramesArray.push(captureCanvas.toDataURL('image/jpeg', 0.8));
}
gifshot.createGIF({
images: imageFramesArray,
gifWidth: imgWidth,
gifHeight: imgHeight,
interval: dur / totalFrames,
numFrames: totalFrames,
loop: 0
}, function (obj) {
if (!obj.error) {
const downloadLink = document.createElement('a');
downloadLink.href = obj.image;
downloadLink.download = 'feathered-parallax.gif';
document.body.appendChild(downloadLink);
downloadLink.click();
document.body.removeChild(downloadLink);
statusMsg.textContent = "GIF successfully saved!";
statusMsg.style.color = "#28a745";
} else {
statusMsg.textContent = "Error compiling file payload metrics.";
statusMsg.style.color = "#dc3545";
}
isAnimating = true;
startTime = performance.now();
renderParallaxFrame();
});
});
</script>
    </body>
    </html>
