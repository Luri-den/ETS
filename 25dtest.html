<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Photo Animator Tool</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #fff; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            width: 1100px;
            margin-top: 20px;
        }
        .workspace, .controls {
            background-color: #262626;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .workspace {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 500px;
        }
        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .canvas-container {
            position: relative;
            background-color: #111;
            border: 2px dashed #444;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            width: 650px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            cursor: crosshair;
            display: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 13px; color: #aaa; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .status {
            font-size: 14px;
            color: #ffc107;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>2.5D Photo Animator</h1>
    <p style="margin: 0; color: #888;">Isolate a foreground subject to generate a 3D parallax zoom loop.</p>

    <div class="container">
        <div class="workspace">
            <input type="file" id="upload" accept="image/*">
            <div class="canvas-container" id="canvasBox">
                <span id="uploadPrompt" style="color: #666;">Upload an image to begin</span>
                <canvas id="bgCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>
                <canvas id="viewCanvas"></canvas>
            </div>
            <div id="statusMsg" class="status"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>1. Brush Settings</label>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="range" id="brushSize" min="5" max="100" value="30">
                    <span id="brushVal" style="width:30px;">30px</span>
                </div>
                <button id="clearMaskBtn" class="hidden" style="background:#dc3545;">Reset Mask</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; width:100%;">

            <div class="control-group">
                <label>2. Timeline Preview</label>
                <button id="generateBtn" disabled>Generate Animation</button>
                <button id="editBtn" class="hidden">Back to Masking</button>
            </div>

            <div id="animSliders" class="hidden" style="display:flex; flex-direction:column; gap:15px;">
                <div class="control-group">
                    <label>Background Zoom Speed</label>
                    <input type="range" id="bgZoom" min="0" max="40" value="15">
                </div>
                <div class="control-group">
                    <label>Foreground Zoom Speed</label>
                    <input type="range" id="fgZoom" min="0" max="40" value="5">
                </div>
                <div class="control-group">
                    <label>Animation Duration (Seconds)</label>
                    <input type="range" id="duration" min="1" max="5" value="3" step="0.5">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; width:100%;">

            <div class="control-group">
                <label>3. Export File</label>
                <button id="exportBtn" class="btn-success" disabled>Export as GIF</button>
            </div>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const maskCanvas = document.getElementById('maskCanvas');
        const bgCanvas = document.getElementById('bgCanvas');
        const viewCanvas = document.getElementById('viewCanvas');
        const brushSize = document.getElementById('brushSize');
        const brushVal = document.getElementById('brushVal');
        const generateBtn = document.getElementById('generateBtn');
        const editBtn = document.getElementById('editBtn');
        const clearMaskBtn = document.getElementById('clearMaskBtn');
        const exportBtn = document.getElementById('exportBtn');
        const animSliders = document.getElementById('animSliders');
        const bgZoomSlider = document.getElementById('bgZoom');
        const fgZoomSlider = document.getElementById('fgZoom');
        const durationSlider = document.getElementById('duration');
        const statusMsg = document.getElementById('statusMsg');

        const maskCtx = maskCanvas.getContext('2d');
        const bgCtx = bgCanvas.getContext('2d');
        const viewCtx = viewCanvas.getContext('2d');

        let sourceImg = null;
        let isDrawing = false;
        let isAnimating = false;
        let animFrameId = null;
        let imgWidth = 0;
        let imgHeight = 0;
        let startTime = 0;

        const fgTempCanvas = document.createElement('canvas');
        const fgTempCtx = fgTempCanvas.getContext('2d');
        const bgTempCanvas = document.createElement('canvas');
        const bgTempCtx = bgTempCanvas.getContext('2d');

        brushSize.addEventListener('input', (e) => {
            brushVal.textContent = e.target.value + 'px';
        });

        // FIXED UPLOADER LOGIC: Selects index [0] explicitly and re-instantiates variables safely
        upload.addEventListener('change', (e) => {
            if (!e.target.files || e.target.files.length === 0) return;
            const file = e.target.files[0]; 

            statusMsg.textContent = "Loading image into memory...";
            statusMsg.style.color = "#ffc107";

            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImg = new Image(); 
                sourceImg.onload = () => {
                    setupWorkspace();
                };
                sourceImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function setupWorkspace() {
            stopAnimation();

            imgWidth = sourceImg.naturalWidth || sourceImg.width;
            imgHeight = sourceImg.naturalHeight || sourceImg.height;

            if (!imgWidth || !imgHeight) {
                statusMsg.textContent = "Error: Image dimensions are invalid.";
                statusMsg.style.color = "#dc3545";
                return;
            }

            // Downscale engine calculations
            const maxW = 650;
            const maxH = 450;
            let scale = Math.min(maxW / imgWidth, maxH / imgHeight);
            imgWidth = Math.floor(imgWidth * scale);
            imgHeight = Math.floor(imgHeight * scale);

            // Re-map constraints across all elements synchronously
            [maskCanvas, bgCanvas, viewCanvas, fgTempCanvas, bgTempCanvas].forEach(canvas => {
                canvas.width = imgWidth;
                canvas.height = imgHeight;
                canvas.style.width = imgWidth + "px";
                canvas.style.height = imgHeight + "px";
            });

            // Paint canvas layers immediately
            bgCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
            maskCtx.clearRect(0, 0, imgWidth, imgHeight);
            maskCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);

            // Interface visibility adjustments
            uploadPrompt.style.display = 'none';
            
            maskCanvas.style.display = 'block';
            bgCanvas.style.display = 'none';
            viewCanvas.style.display = 'none';
            
            clearMaskBtn.classList.remove('hidden');
            generateBtn.removeAttribute('disabled');
            exportBtn.setAttribute('disabled', 'true');
            editBtn.classList.add('hidden');
            generateBtn.classList.remove('hidden');
            animSliders.classList.add('hidden');
            
statusMsg.textContent = "Success! Paint a visible red mask over your foreground subject.";
statusMsg.style.color = "#28a745";
}
// Painting Engine
maskCanvas.addEventListener('mousedown', startPaint);
maskCanvas.addEventListener('mousemove', paintMove);
window.addEventListener('mouseup', stopPaint);
function startPaint(e) {
isDrawing = true;
paintMove(e);
}
function paintMove(e) {
if (!isDrawing) return;
const rect = maskCanvas.getBoundingClientRect();
const x = (e.clientX - rect.left) * (imgWidth / rect.width);
const y = (e.clientY - rect.top) * (imgHeight / rect.height);
maskCtx.save();
maskCtx.globalCompositeOperation = 'source-over';
maskCtx.fillStyle = 'rgba(255, 0, 0, 0.5)';
maskCtx.beginPath();
maskCtx.arc(x, y, brushSize.value / 2, 0, Math.PI * 2);
maskCtx.fill();
maskCtx.restore();
}
function stopPaint() { isDrawing = false; }
clearMaskBtn.addEventListener('click', () => {
if (confirm("Reset current mask pathing?")) setupWorkspace();
});
// Separation Layer Computations
generateBtn.addEventListener('click', prepareAndAnimate);
editBtn.addEventListener('click', () => {
stopAnimation();
maskCanvas.style.display = 'block';
viewCanvas.style.display = 'none';
editBtn.classList.add('hidden');
generateBtn.classList.remove('hidden');
animSliders.classList.add('hidden');
exportBtn.setAttribute('disabled', 'true');
statusMsg.textContent = "Adjust mask positioning.";
statusMsg.style.color = "#ffc107";
});
function prepareAndAnimate() {
statusMsg.textContent = "Processing layout separations...";
fgTempCtx.clearRect(0,0, imgWidth, imgHeight);
fgTempCtx.drawImage(maskCanvas, 0, 0);
fgTempCtx.globalCompositeOperation = 'source-in';
fgTempCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
bgTempCtx.clearRect(0,0, imgWidth, imgHeight);
bgTempCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
bgTempCtx.globalCompositeOperation = 'destination-out';
bgTempCtx.drawImage(fgTempCanvas, 0, 0);
bgTempCtx.globalCompositeOperation = 'destination-over';
bgTempCtx.filter = 'blur(4px)';
bgTempCtx.drawImage(sourceImg, 0, 0, imgWidth, imgHeight);
bgTempCtx.filter = 'none';
maskCanvas.style.display = 'none';
viewCanvas.style.display = 'block';
generateBtn.classList.add('hidden');
editBtn.classList.remove('hidden');
animSliders.classList.remove('hidden');
exportBtn.removeAttribute('disabled');
isAnimating = true;
startTime = performance.now();
renderParallaxFrame();
}
function stopAnimation() {
isAnimating = false;
if (animFrameId) cancelAnimationFrame(animFrameId);
}
function renderParallaxFrame(time = performance.now()) {
if (!isAnimating) return;
viewCtx.clearRect(0, 0, imgWidth, imgHeight);
const bgMax = parseFloat(bgZoomSlider.value) / 200;
const fgMax = parseFloat(fgZoomSlider.value) / 200;
const dur = parseFloat(durationSlider.value);
let elapsed = ((time - startTime) / 1000) % dur;
let progress = elapsed / dur;
let ease = Math.sin(progress * Math.PI);
let bgS = 1.0 + (ease * bgMax);
let fgS = 1.0 + (ease * fgMax);
viewCtx.save();
viewCtx.translate(imgWidth / 2, imgHeight / 2);
viewCtx.scale(bgS, bgS);
viewCtx.drawImage(bgTempCanvas, -imgWidth / 2, -imgHeight / 2);
viewCtx.restore();
viewCtx.save();
viewCtx.translate(imgWidth / 2, imgHeight / 2);
viewCtx.scale(fgS, fgS);
viewCtx.drawImage(fgTempCanvas, -imgWidth / 2, -imgHeight / 2);
viewCtx.restore();
statusMsg.textContent = "Live preview active.";
statusMsg.style.color = "#007bff";
animFrameId = requestAnimationFrame(renderParallaxFrame);
}
// Export Payload Encoder
exportBtn.addEventListener('click', () => {
stopAnimation();
exportBtn.setAttribute('disabled', 'true');
statusMsg.textContent = "Encoding loop layers to GIF. Please wait...";
statusMsg.style.color = "#ffc107";
const bgMax = parseFloat(bgZoomSlider.value) / 200;
const fgMax = parseFloat(fgZoomSlider.value) / 200;
const dur = parseFloat(durationSlider.value);
const totalFrames = 25;
const imageFramesArray = [];
const captureCanvas = document.createElement('canvas');
captureCanvas.width = imgWidth;
captureCanvas.height = imgHeight;
const captureCtx = captureCanvas.getContext('2d');
for (let i = 0; i < totalFrames; i++) {
let progress = i / totalFrames;
let ease = Math.sin(progress * Math.PI);
let bgS = 1.0 + (ease * bgMax);
let fgS = 1.0 + (ease * fgMax);
captureCtx.clearRect(0, 0, imgWidth, imgHeight);
captureCtx.save();
captureCtx.translate(imgWidth / 2, imgHeight / 2);
captureCtx.scale(bgS, bgS);
captureCtx.drawImage(bgTempCanvas, -imgWidth / 2, -imgHeight / 2);
captureCtx.restore();
captureCtx.save();
captureCtx.translate(imgWidth / 2, imgHeight / 2);
captureCtx.scale(fgS, fgS);
captureCtx.drawImage(fgTempCanvas, -imgWidth / 2, -imgHeight / 2);
captureCtx.restore();
imageFramesArray.push(captureCanvas.toDataURL('image/jpeg', 0.8)); // Compression optimization
}
gifshot.createGIF({
images: imageFramesArray,
gifWidth: imgWidth,
gifHeight: imgHeight,
interval: dur / totalFrames,
numFrames: totalFrames,
loop: 0
}, function (obj) {
if (!obj.error) {
const downloadLink = document.createElement('a');
downloadLink.href = obj.image;
downloadLink.download = 'parallax-animation.gif';
document.body.appendChild(downloadLink);
downloadLink.click();
document.body.removeChild(downloadLink);
statusMsg.textContent = "GIF successfully downloaded!";
statusMsg.style.color = "#28a745";
} else {
statusMsg.textContent = "Error compiling file payload metrics.";
statusMsg.style.color = "#dc3545";
}
isAnimating = true;
startTime = performance.now();
renderParallaxFrame();
});
});
    </script>
</body>
</html>
